<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smoke Renderer Filter (#vibecoding)</title>
  <style>
    :root {
      --primary: #007aff;
      --bg-dark: rgba(10, 10, 12, 0.85);
      --border-color: rgba(255, 255, 255, 0.2);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #050505;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mirror {
      transform: scaleX(-1);
    }
    /* Top Status Bar */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .status-badge {
      background: var(--bg-dark);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 30px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3b30;
    }
    .indicator.online {
      background: #30d158;
      box-shadow: 0 0 10px #30d158;
    }
    .fps-counter {
      background: var(--bg-dark);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 14px;
      border-radius: 20px;
      color: #00f0ff;
      font-family: monospace;
      font-size: 11px;
      border: 1px solid var(--border-color);
    }
    /* Controls Section */
    .controls-wrapper {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }
    .mode-selector {
      display: flex;
      background: var(--bg-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 4px;
      border-radius: 32px;
      border: 1px solid var(--border-color);
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 12px 18px;
      border-radius: 28px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
    }
    .settings-panel {
      background: var(--bg-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ccc;
      font-size: 12px;
      font-weight: 500;
    }
    .slider-row input[type=range] {
      width: 55%;
      accent-color: #007aff;
      cursor: pointer;
    }
    /* Camera Access Button Overlay */
    .camera-btn-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .cam-btn {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4);
    }
  </style>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="app-container">
  <div class="viewport">
    <video id="webcam" class="mirror" playsinline autoplay muted></video>
    <canvas id="output_canvas" class="mirror"></canvas>

    <div class="top-bar">
      <div class="status-badge">
        <div class="indicator" id="status-indicator"></div>
        <span id="status-text">Камер нээхийг хүлээж байна...</span>
      </div>
      <div class="fps-counter" id="fps-display">00 FPS</div>
    </div>

    <div class="camera-btn-overlay" id="cam-overlay">
      <button class="cam-btn" id="start-cam-btn">📷 Камер Идэвхжүүлэх</button>
    </div>

    <div class="controls-wrapper">
      <div class="settings-panel">
        <div class="slider-row">
          <span>Density Multiplier:</span>
          <input type="range" id="density-slider" min="0.2" max="2.5" step="0.1" value="1.0">
        </div>
        <div class="slider-row">
          <span>Smoke Size:</span>
          <input type="range" id="size-slider" min="4" max="20" step="1" value="8">
        </div>
      </div>

      <div class="mode-selector">
        <button class="mode-btn active" id="btn-mouth">MOUTH BURST</button>
        <button class="mode-btn" id="btn-nose">NOSE BURST</button>
      </div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  SMOKE_VOLUME_MULTIPLIER: 1.0,
  BASE_PARTICLE_SIZE: 8,
  MAX_PARTICLES: 1200
};

let currentMode = 'MOUTH_BURST';

// Performance Tracker
class FPSTracker {
  constructor() {
    this.fps = 0;
    this.frames = 0;
    this.lastTime = performance.now();
  }

  tick() {
    this.frames++;
    const now = performance.now();
    if (now - this.lastTime >= 1000) {
      this.fps = this.frames;
      this.frames = 0;
      this.lastTime = now;
      document.getElementById('fps-display').innerText = `${this.fps} FPS`;
    }
  }
}

// Particle Engine
class SmokeParticle {
  constructor() { this.reset(); }
  reset() {
    this.active = false; this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.size = 0; this.maxLife = 0; this.life = 0; this.rotation = 0; this.spin = 0;
  }
  spawn(x, y, vx, vy, size, maxLife) {
    this.active = true; this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.size = size; this.maxLife = maxLife; this.life = maxLife;
    this.rotation = Math.random() * Math.PI * 2;
    this.spin = (Math.random() - 0.5) * 0.04;
  }
  update() {
    if (!this.active) return;
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.06;
    this.vx *= 0.98;
    this.size += 0.45;
    this.rotation += this.spin;
    this.life--;
    if (this.life <= 0) this.active = false;
  }
  draw(ctx) {
    if (!this.active) return;
    const progress = this.life / this.maxLife;
    const alpha = Math.sin(progress * Math.PI) * 0.3;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
    grad.addColorStop(0, `rgba(245, 247, 255, ${alpha})`);
    grad.addColorStop(0.4, `rgba(210, 220, 235, ${alpha * 0.6})`);
    grad.addColorStop(1, 'rgba(160, 175, 200, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class ParticlePool {
  constructor(size) {
    this.pool = Array.from({ length: size }, () => new SmokeParticle());
  }
  getFreeParticle() { return this.pool.find(p => !p.active); }
  updateAndDraw(ctx) {
    for (let p of this.pool) {
      if (p.active) { p.update(); p.draw(ctx); }
    }
  }
}

class SmokeRenderer {
  constructor(pool) { this.pool = pool; }
  emitMouthBurst(origin) {
    const count = Math.round(360 * CONFIG.SMOKE_VOLUME_MULTIPLIER);
    for (let i = 0; i < Math.floor(count / 12); i++) {
      const p = this.pool.getFreeParticle();
      if (p) {
        const vx = (Math.random() - 0.5) * 2.5;
        const vy = (Math.random() - 0.2) * 1.8 + 0.8;
        const size = Math.random() * CONFIG.BASE_PARTICLE_SIZE + 4;
        p.spawn(origin.x, origin.y, vx, vy, size, 60 + Math.random() * 30);
      }
    }
  }
  emitNoseBurst(origins) {
    const count = Math.round(90 * CONFIG.SMOKE_VOLUME_MULTIPLIER);
    origins.forEach(origin => {
      for (let i = 0; i < Math.floor(count / 6); i++) {
        const p = this.pool.getFreeParticle();
        if (p) {
          const vx = (Math.random() - 0.5) * 1.4;
          const vy = (Math.random() * 1.8) + 0.5;
          const size = Math.random() * (CONFIG.BASE_PARTICLE_SIZE * 0.7) + 3;
          p.spawn(origin.x, origin.y, vx, vy, size, 50 + Math.random() * 25);
        }
      }
    });
  }
}

const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const statusText = document.getElementById('status-text');
const statusIndicator = document.getElementById('status-indicator');

const fpsTracker = new FPSTracker();
const particlePool = new ParticlePool(CONFIG.MAX_PARTICLES);
const smokeEngine = new SmokeRenderer(particlePool);

// Mode Button Listeners
document.getElementById('btn-mouth').addEventListener('click', () => {
  currentMode = 'MOUTH_BURST';
  updateUI('btn-mouth');
});

document.getElementById('btn-nose').addEventListener('click', () => {
  currentMode = 'NOSE_BURST';
  updateUI('btn-nose');
});

document.getElementById('density-slider').addEventListener('input', (e) => {
  CONFIG.SMOKE_VOLUME_MULTIPLIER = parseFloat(e.target.value);
});

document.getElementById('size-slider').addEventListener('input', (e) => {
  CONFIG.BASE_PARTICLE_SIZE = parseFloat(e.target.value);
});

function updateUI(activeId) {
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(activeId).classList.add('active');
}

function onFaceResults(results) {
  fpsTracker.tick();
  if (canvasElement.width !== videoElement.videoWidth) {
    canvasElement.width = videoElement.videoWidth || 640;
    canvasElement.height = videoElement.videoHeight || 480;
  }

  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    statusIndicator.classList.add('online');
    statusText.innerText = "Tracking Active";
    const landmarks = results.multiFaceLandmarks[0];

    const mouthOrigin = {
      x: landmarks[13].x * canvasElement.width,
      y: landmarks[13].y * canvasElement.height
    };
    const leftNostril = {
      x: landmarks[242].x * canvasElement.width,
      y: landmarks[242].y * canvasElement.height
    };
    const rightNostril = {
      x: landmarks[462].x * canvasElement.width,
      y: landmarks[462].y * canvasElement.height
    };

    if (currentMode === 'MOUTH_BURST') {
      smokeEngine.emitMouthBurst(mouthOrigin);
    } else {
      smokeEngine.emitNoseBurst([leftNostril, rightNostril]);
    }
  } else {
    statusIndicator.classList.remove('online');
    statusText.innerText = "Нүүр хайж байна...";
  }

  particlePool.updateAndDraw(canvasCtx);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
faceMesh.onResults(onFaceResults);

// Start Camera Handler
document.getElementById('start-cam-btn').addEventListener('click', async () => {
  document.getElementById('cam-overlay').style.display = 'none';
  statusText.innerText = "Камер нээж байна...";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    videoElement.srcObject = stream;
    
    const camera = new Camera(videoElement, {
      onFrame: async () => { await faceMesh.send({ image: videoElement }); },
      width: 640,
      height: 480
    });
    camera.start();
  } catch (err) {
    alert("Камерын зөвшөөрөл олгогдоогүй байна! Браузерын тохиргооноос зөвшөөрнө үү.");
    statusText.innerText = "Камерын алдаа!";
  }
});
</script>
</body>
</html>
